name: talk-to-doc-local

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
  vllm-llm:
    image: vllm/vllm-openai:v0.28.0
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_USE_V2_MODEL_RUNNER: "${VLLM_USE_V2_MODEL_RUNNER:-0}"
    command:
      - Qwen/Qwen3-4B-AWQ
      - --served-model-name
      - qwen3-4b-awq
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --gpu-memory-utilization
      - "0.30"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      # - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  vllm-stt:
    build:
      context: .
      dockerfile: deploy/Dockerfile.vllm-stt
    image: echolex-vllm-stt:v0.28.0
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_USE_V2_MODEL_RUNNER: "${VLLM_USE_V2_MODEL_RUNNER:-0}"
    command:
      - Qwen/Qwen3-ASR-0.6B
      - --served-model-name
      - qwen3-asr-0.6b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - "3072"
      - --gpu-memory-utilization
      - "0.20"
      - --max-num-seqs
      - "1"
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  vllm-tts:
    image: vllm/vllm-omni:v0.28.0
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
      - type: bind
        source: ./deploy/qwen3_tts_16gb.yaml
        target: /etc/vllm/qwen3_tts_16gb.yaml
        read_only: true
        bind:
          create_host_path: false
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_USE_V2_MODEL_RUNNER: "${VLLM_USE_V2_MODEL_RUNNER:-0}"
    command:
      - vllm
      - serve
      - Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --gpu-memory-utilization
      - "0.20"
      - --max-model-len
      - "3072"
      - --max-num-seqs
      - "1"
      - --enforce-eager
      - --log-stats
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 120s

volumes:
  qdrant-storage:
  vllm-hf-cache:
