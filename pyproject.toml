[project]
name = "talk-to-doc-local"
version = "0.1.0"
description = "Production-oriented local voice RAG application with Pipecat, vLLM, Qdrant, SentenceTransformers, and PyMuPDF."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pipecat-ai[openai,webrtc,runner]==1.7.0",
  "pymupdf>=1.26,<2",
  "qdrant-client>=1.14,<2",
  "sentence-transformers>=5,<6",
  "python-dotenv>=1.1,<2",
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
echolex-bot = "echolex.bot:main"
echolex-ingest = "echolex.cli.ingest:main"
echolex-health = "echolex.cli.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echolex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
