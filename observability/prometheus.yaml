---
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_native_histograms: true

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - container.name
    - deployment.environment.name
    - host.name

storage:
  tsdb:
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: vllm-llm
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-llm:8000
        labels:
          inference_role: llm
          model_service: qwen3-4b-awq
          model_repository: Qwen/Qwen3-4B-AWQ
          model_dtype: auto
          model_quantization: awq
          max_model_len: "8192"
          max_num_seqs: "1"
          gpu_memory_utilization: "0.30"
          execution_mode: eager

  - job_name: vllm-stt
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-stt:8000
        labels:
          inference_role: stt
          model_service: qwen3-asr-0.6b
          model_repository: Qwen/Qwen3-ASR-0.6B
          model_dtype: bfloat16
          model_quantization: none
          max_model_len: "3072"
          max_num_seqs: "1"
          gpu_memory_utilization: "0.20"
          execution_mode: eager

  - job_name: vllm-tts
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-tts:8000
        labels:
          inference_role: tts
          model_service: qwen3-tts-0.6b
          model_repository: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
          model_dtype: bfloat16
          model_quantization: none
          max_model_len: "3072"
          max_num_seqs: "1"
          gpu_memory_utilization: "0.20"
          execution_mode: eager