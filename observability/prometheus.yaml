---
# Standalone fallback configuration.
# The canonical local configuration is the env-backed Prometheus config embedded in
# docker-compose.observability.yml. This file intentionally does not hardcode model
# repositories, model names, dtypes, quantization, context length, or serving parameters.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_native_histograms: true

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - container.name
    - deployment.environment.name
    - host.name

storage:
  tsdb:
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: dcgm-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - dcgm-exporter:9400

  - job_name: vllm-llm
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-llm:8000
        labels:
          inference_role: llm
          model_service: llm

  - job_name: vllm-stt
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-stt:8000
        labels:
          inference_role: stt
          model_service: stt

  - job_name: vllm-tts
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-tts:8000
        labels:
          inference_role: tts
          model_service: tts

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets:
          - qdrant:6333
