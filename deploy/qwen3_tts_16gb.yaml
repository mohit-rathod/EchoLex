# Qwen3-TTS 0.6B single-GPU profile for a constrained 16 GiB card shared
# with an LLM and ASR service.
#
# IMPORTANT:
# This is a repository-specific low-concurrency tuning profile.
# It is NOT a universal Qwen3-TTS recommendation.
#
# GPU memory usage depends on GPU architecture, model versions, context
# lengths, batching, concurrency, CUDA/PyTorch versions, and vLLM versions.
#
# Validate VRAM usage and latency on your own hardware before increasing
# context length, batching, or concurrent requests.
#
# This configuration intentionally:
# - limits both stages to one active sequence,
# - reduces vLLM memory reservation,
# - disables CUDA graph reservation through eager execution,
# - keeps the codec lengths required by Qwen3-TTS streaming.

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300

      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1

      decode_batch_max_size: 1

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.15

    enforce_eager: true
    trust_remote_code: true

    enable_prefix_caching: false
    async_scheduling: true

    max_num_batched_tokens: 512
    max_model_len: 4096

    devices: "0"

    output_connectors:
      to_stage_1: connector_of_shared_memory

    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      min_tokens: 2
      repetition_penalty: 1.05

    silence_ban_frames: 0

    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.10

    enforce_eager: true
    trust_remote_code: true

    enable_prefix_caching: false
    async_scheduling: true

    max_num_batched_tokens: 65536
    max_model_len: 65536

    devices: "0"

    input_connectors:
      from_stage_0: connector_of_shared_memory

    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0